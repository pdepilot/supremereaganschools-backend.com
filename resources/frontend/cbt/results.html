<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/site/Image/logo_main.png">
  <link rel="apple-touch-icon" href="/site/Image/logo_main.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT results | Supreme Reagan Schools</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site/CSS/cbt.css">
</head>
<body class="cbt-app" data-cbt-page="results">
  <div class="cbt-shell">
    <header class="cbt-top">
      <div class="cbt-brand">
        <img src="/site/Image/logo_main.png" alt="">
        <div>
          <strong>CBT results</strong>
          <span data-cbt-student-label>Loading…</span>
        </div>
      </div>
      <nav class="cbt-nav">
        <a href="/cbt">Desk</a>
        <a class="is-active" href="/cbt/results">Results</a>
        <a href="/cbt/logout" data-cbt-logout>Sign out</a>
      </nav>
    </header>

    <div class="cbt-status-bar">
      <span><span class="cbt-status-dot" data-cbt-conn-dot></span><span data-cbt-conn-label>Checking connection…</span></span>
    </div>

    <div class="cbt-alert" data-cbt-alert></div>

    <section class="cbt-panel">
      <h1>Your CBT results</h1>
      <p class="cbt-lede">Scores and grades are calculated on the server after submission.</p>
      <div class="cbt-grid" data-cbt-results-list>
        <div class="cbt-empty">Loading results…</div>
      </div>
    </section>
  </div>
  <script src="/site/JS/portal-cbt.js?v=20260908f"></script>
</body>
</html>
