<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/site/Image/logo_main.png">
  <link rel="apple-touch-icon" href="/site/Image/logo_main.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Work | Supreme Reagan Schools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/staff-desk.css">
</head>
<body class="faculty-house pupil-house" data-page="student_assignments">
  <div class="house">
    <aside class="rail" aria-label="Pupil navigation">
      <div class="rail-mark">PUPIL</div>
      <nav class="rail-nav">
        <a class="rail-btn" href="student_dashboard.html"><span>Desk</span></a>
        <a class="rail-btn" href="profile.html"><span>Profile</span></a>
        <a class="rail-btn" href="academics.html"><span>Marks</span></a>
        <a class="rail-btn active" href="assignments.html" aria-current="page"><span>Work</span></a>
        <a class="rail-btn" href="attendance.html"><span>Roll</span></a>
        <a class="rail-btn" href="fees.html"><span>Fees</span></a>
        <a class="rail-btn" href="timetable.html"><span>Bells</span></a>
        <a class="rail-btn" href="materials.html"><span>Papers</span></a>
        <a class="rail-btn" href="messages.html"><span>Letters</span></a>
        <a class="rail-btn" href="announcements.html"><span>Notices</span></a>
        <a class="rail-btn" href="settings.html"><span>Setup</span></a>
      </nav>
      <a class="rail-exit" href="../Parent_studentPage.html" data-logout title="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 7V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2v-2"></path>
          <path d="M15 12H3"></path>
          <path d="M6 9l-3 3 3 3"></path>
        </svg>
        <strong>Log out</strong>
      </a>
    </aside>

    <div class="stage">
      <header class="stage-head compact">
        <div class="head-top">
          <div>
            <p class="kicker">Pupil · The board</p>
            <h1>Assignments</h1>
            <p class="head-copy">Work set for your form. Open a sheet to read the instructions and hand in your paper.</p>
          </div>
          <div class="live-pill"><i class="live-dot"></i> <span data-clock>00:00:00</span> · Desk open</div>
        </div>
        <div class="metric-rail">
          <article class="metric"><span class="label">Open work</span><span class="value" data-metric="open">—</span><span class="delta" data-metric-delta="open">On the board</span></article>
          <article class="metric"><span class="label">This week</span><span class="value" data-metric="soon">—</span><span class="delta" data-metric-delta="soon">Due soon</span></article>
          <article class="metric"><span class="label">Overdue</span><span class="value" data-metric="overdue">—</span><span class="delta" data-metric-delta="overdue">Past the bell</span></article>
        </div>
      </header>
      <p class="desk-note" data-desk-note hidden></p>
      <main class="workspace">
        <section class="panel">
          <div class="tasks" data-assignment-list></div>
        </section>
      </main>
    </div>
  </div>
  <script src="../JS/portal-student-pages.js"></script>
</body>
</html>
