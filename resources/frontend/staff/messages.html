<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/site/Image/logo_main.png">
  <link rel="apple-touch-icon" href="/site/Image/logo_main.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Letters | Supreme Reagan Schools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/staff-desk.css">
</head>
<body class="faculty-house" data-page="messages">
  <div class="house">
    <aside class="rail" aria-label="Faculty navigation">
      <div class="rail-mark">FACULTY</div>
      <nav class="rail-nav">
        <a class="rail-btn" href="staff.html"><span>Desk</span></a>
        <a class="rail-btn" href="students.html"><span>Pupils</span></a>
        <a class="rail-btn" href="attendance.html"><span>Roll</span></a>
        <a class="rail-btn" href="assignments.html"><span>Work</span></a>
        <a class="rail-btn" href="grades.html"><span>Marks</span></a>
        <a class="rail-btn" href="reports.html"><span>Reports</span></a>
        <a class="rail-btn" href="timetable.html"><span>Bells</span></a>
        <a class="rail-btn" href="materials.html"><span>Papers</span></a>
        <a class="rail-btn active" href="messages.html" aria-current="page"><span>Letters</span></a>
        <a class="rail-btn" href="announcements.html"><span>Notices</span></a>
        <a class="rail-btn" href="profile.html"><span>Profile</span></a>
        <a class="rail-btn" href="settings.html"><span>Setup</span></a>
      </nav>
      <a class="rail-exit" href="../staffLogin.html" data-logout title="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 7V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2v-2"></path>
          <path d="M15 12H3"></path>
          <path d="M6 9l-3 3 3 3"></path>
        </svg>
        <strong>Log out</strong>
      </a>
    </aside>

    <div class="stage">
      <header class="stage-head compact">
        <div class="head-top">
          <div>
            <p class="kicker">Faculty · Correspondence</p>
            <h1>Letters</h1>
            <p class="head-copy">Write to a parent, a colleague, or the office. The chute is live.</p>
          </div>
          <button class="gold-btn" type="button" id="composeButton" data-open-modal="composeModal">New letter</button>
        </div>
      </header>

      <main class="workspace">
        <div class="letters">
          <aside class="letter-list">
            <div class="toolbar" style="padding:0.85rem">
              <input type="search" id="conversationSearch" placeholder="Search letters">
            </div>
            <div id="conversationList">
              <p class="empty" style="padding:1rem">Connecting to the chute…</p>
            </div>
          </aside>
          <section class="letter-thread">
            <div class="chat-head">
              <h2>Thread</h2>
            </div>
            <div class="chat-body" id="chatBody">
              <p>Select a conversation.</p>
            </div>
            <div class="chat-compose">
              <input id="messageInput" type="text" placeholder="Write a line…">
              <button class="gold-btn" type="button" id="sendMessage">Send</button>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="house-modal message-modal" id="composeModal">
    <div class="house-modal-card">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Compose</p>
          <h3>New letter</h3>
        </div>
        <button class="ghost-btn" type="button" id="closeCompose" data-close-modal>Close</button>
      </div>
      <form id="composeForm">
        <label class="field"><span>Recipient</span><select id="composeRecipient" required><option value="">Select recipient</option></select></label>
        <label class="field"><span>Subject</span><input id="composeSubject" required></label>
        <label class="field"><span>Letter</span><textarea id="composeBody" rows="5" required></textarea></label>
        <div class="modal-actions">
          <button class="ghost-btn" type="button" id="cancelCompose" data-close-modal>Cancel</button>
          <button class="gold-btn" type="submit">Dispatch</button>
        </div>
      </form>
    </div>
  </div>
  <script src="../JS/portal-staff-chrome.js"></script>
  <script src="../JS/portal-classroom.js"></script>
</body>
</html>
